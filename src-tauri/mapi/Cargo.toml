[package]
name = "classicmail_mapi"
version = "1.0.0"
edition = "2024"
description = "Simple MAPI mail client DLL: Office's \"Email\" / \"Send as attachment\" opens a ClassicMail message"
publish = false

# its own small build, not part of the app's (built by the app's build.rs for x64 and x86)
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
