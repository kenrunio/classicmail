[package]
name = "classicmail"
version = "1.24.2"
description = "ClassicMail — a desktop client for Google Workspace and Gmail in the classic Outlook style"
authors = ["Kenny Green <info@duvz.com>"]
license = "Apache-2.0"
repository = "https://github.com/kenrunio/classicmail"
edition = "2024"

[lib]
# The `_lib` suffix avoids a bin/lib name clash on Windows (cargo#8519).
name = "classicmail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "http2", "stream", "charset", "multipart"] }
rusqlite = { version = "0.40", features = ["bundled", "serde_json", "functions"] }
axum = "0.8"
keyring = { version = "3", features = ["windows-native"] }
mail-builder = "1"
mail-parser = "0.11"
encoding_rs = "0.8"
lnk = "0.6"
ammonia = "4"
html2text = "0.17"
base64 = "0.22"
sha2 = "0.10"
rand = "0.9"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
thiserror = "2"
anyhow = "1"
log = "0.4"
parking_lot = "0.12"
regex = "1"
uuid = { version = "1", features = ["v4"] }
mime_guess = "2"
urlencoding = "2"
# fast initial mail download over Gmail IMAP (same rustls stack reqwest already uses)
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
# Outlook archives (.pst), read-only (Microsoft's reader)
outlook-pst = "1.2"
calamine = { version = "0.36.1", features = ["dates"] }
# attachment preview: Word documents (the same versions calamine uses)
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
csv = "1.4.0"
drag = "2"
iana-time-zone = "0.1"

# spare windows (src/spare.rs): drawn while fully transparent, then made opaque
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_UI_Shell", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security", "Win32_System_Com", "Win32_Storage_FileSystem"] }

[dev-dependencies]
# writes small Unicode PST fixtures for the archive tests (fork of outlook-pst with a writer)
pst_rw = { package = "outlook-pst-rw", version = "1.2.9" }
rust_xlsxwriter = "0.99.1"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[profile.dev]
# keep debug builds quick to link; deps optimised so sync/parsing isn't painfully slow in dev
debug = 1
[profile.dev.package."*"]
opt-level = 2
